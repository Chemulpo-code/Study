version: '3.8'

services:
  chinese-study:
    image: chinese-study:1.9.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chinese-study-app
    labels:
      - "version=1.9.0"
      - "app=chinese-study"
    restart: always
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=production
      - PORT=5005
      - JWT_SECRET=super_secret_custom_chinese_key_change_me
    volumes:
      - chinese_data:/app/server/data
      - chinese_tts_cache:/app/server/tts_cache

volumes:
  chinese_data:
  chinese_tts_cache:
