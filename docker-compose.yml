version: '3.8'

services:
  chinese-study:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chinese-study-app
    labels:
      - "version=1.9.8"
      - "app=chinese-study"
    restart: always
    ports:
      - "5005:5005"
    environment:
      - NODE_ENV=production
      - PORT=5005
      - JWT_SECRET=super_secret_custom_chinese_key_change_me
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
    volumes:
      - chinese_data:/app/server/data
      - chinese_tts_cache:/app/server/tts_cache

volumes:
  chinese_data:
  chinese_tts_cache:
